<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abs Exam Center</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #0f172a; color: white; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 30px auto; background: #1e293b; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        input, select, textarea { width: 100%; padding: 10px; margin: 8px 0; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 5px; }
        button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #1d4ed8; }
        .danger-btn { background: #ef4444; }
        .hidden { display: none; }
        .nav-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 15px; }
        .options-list { list-style: none; padding: 0; }
        .options-list li { background: #334155; margin: 8px 0; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>

    <!-- ১. লগইন / সাইনআপ সেকশন -->
    <div id="auth-section" class="container">
        <h2 id="auth-title" style="text-align: center;">লগইন করুন</h2>
        <input type="email" id="email" placeholder="আপনার ইমেইল">
        <input type="password" id="password" placeholder="পাসওয়ার্ড">
        <button onclick="handleAuth()" id="auth-btn">লগইন</button>
        <p style="text-align: center; margin-top: 15px;">
            <span id="toggle-text">অ্যাকাউন্ট নেই?</span> 
            <a href="#" onclick="toggleAuthMode(event)" style="color:#38bdf8;">রেজিস্ট্রেশন করুন</a>
        </p>
    </div>

    <!-- ২. স্টুডেন্ট এক্সাম সেকশন -->
    <div id="exam-section" class="container hidden">
        <div class="nav-header">
            <h3>HSC Exam Portal</h3>
            <button onclick="logout()" class="danger-btn" style="width: auto; padding: 6px 12px;">লগআউট</button>
        </div>
        <div id="question-box">
            <h4 id="question-text">প্রশ্ন লোড হচ্ছে...</h4>
            <ul class="options-list" id="options-list"></ul>
            <button id="next-btn" onclick="nextQuestion()">পরবর্তী প্রশ্ন</button>
            <button id="submit-btn" class="hidden" style="background:#22c55e;" onclick="submitExam()">পরীক্ষা শেষ করুন</button>
        </div>
    </div>

    <!-- ৩. অ্যাডমিন প্যানেল সেকশন -->
    <div id="admin-section" class="container hidden">
        <div class="nav-header">
            <h3>Admin Panel - প্রশ্ন যুক্ত করুন</h3>
            <button onclick="logout()" class="danger-btn" style="width: auto; padding: 6px 12px;">লগআউট</button>
        </div>
        <input type="text" id="admin-q" placeholder="প্রশ্ন লিখুন">
        <input type="text" id="admin-a" placeholder="অপশন A">
        <input type="text" id="admin-b" placeholder="অপশন B">
        <input type="text" id="admin-c" placeholder="অপশন C">
        <input type="text" id="admin-d" placeholder="অপশন D">
        <select id="admin-correct">
            <option value="">সঠিক উত্তর সিলেক্ট করুন</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
        </select>
        <button onclick="addQuestionByAdmin()" style="background:#10b981;">প্রশ্ন সাবমিট করুন</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
