<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abs Exam Center - Premium Platform & Admin Panel</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js for Diagram -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Hind Siliguri', sans-serif;
        }

        body {
            background-color: #3b3383;
            color: #333;
            padding-bottom: 75px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 18px;
            color: white;
        }

        .profile-area {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 15px;
        }

        .avatar-circle {
            background: #e11d48;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        .top-icons {
            display: flex;
            gap: 18px;
            font-size: 18px;
        }

        .container {
            padding: 10px 15px;
            max-width: 500px;
            margin: 0 auto;
        }

        .page-section {
            display: none;
        }

        .page-section.active {
            display: block;
        }

        .banner-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }

        .status-badge {
            display: inline-block;
            background: #e0f2fe;
            color: #0284c7;
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 12px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .banner-title {
            font-size: 15px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .action-btn {
            background: #f59e0b;
            color: #0f172a;
            width: 100%;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .target-title {
            color: #e2e8f0;
            font-size: 13px;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .grid-card {
            background: #ffffff;
            border-radius: 14px;
            padding: 14px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            cursor: pointer;
            transition: transform 0.1s;
        }

        .grid-card:active {
            transform: scale(0.97);
        }

        .icon-box {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .c1 { background: #fef3c7; color: #d97706; }
        .c2 { background: #dcfce7; color: #16a34a; }
        .c3 { background: #e0e7ff; color: #4f46e5; }
        .c4 { background: #e0f2fe; color: #0284c7; }
        .c5 { background: #ffe4e6; color: #e11d48; }
        .c6 { background: #fef9c3; color: #ca8a04; }
        .c7 { background: #fae8ff; color: #a21caf; }
        .c8 { background: #fee2e2; color: #dc2626; }

        .card-info h4 {
            font-size: 14px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 2px;
        }

        .card-info p {
            font-size: 10px;
            color: #64748b;
            line-height: 1.2;
        }

        .inner-page-card {
            background: white;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }

        .inner-page-card h2 {
            color: #1e293b;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .inner-page-card p {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 12px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 4px;
        }

        .form-group select, .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #475569;
            border-radius: 8px;
            font-size: 13px;
            background: #0f172a;
            color: white;
        }

        .option-btn {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #f8fafc;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
            transition: all 0.2s;
        }

        .back-btn {
            background: #e2e8f0;
            color: #334155;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            margin-top: 10px;
            width: 100%;
        }

        /* 👑 ULTRA PREMIUM ADMIN PANEL STYLING */
        .admin-wrapper {
            background: linear-gradient(145deg, #0f172a, #1e1b4b);
            border: 1px solid #38357a;
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            color: white;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }
